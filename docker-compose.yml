services:
  tr-torrent-ui:
    build:
      context: .
      args:
        VITE_API_BASE: ""
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      TR_CONFIG_DIR: /app/config
      TRANSMISSION_HOST: ${TRANSMISSION_HOST:-}
      TRANSMISSION_PORT: ${TRANSMISSION_PORT:-}
      TRANSMISSION_USERNAME: ${TRANSMISSION_USERNAME:-}
      TRANSMISSION_PASSWORD: ${TRANSMISSION_PASSWORD:-}
    volumes:
      - ./config:/app/config
