name: Build and publish Docker image

# 手动触发，或打 v* 标签时自动构建并推送 GHCR
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # 关闭 provenance/attestation：推送经典 schema 2 单镜像清单，老版本 Docker 拉取最稳
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export and convert to traditional-format archive
        run: |
          # buildx 的 type=docker 导出在 containerd worker 下仍产出 OCI 布局，
          # 因此显式导出 OCI 后用本仓库脚本重组为传统 Docker 归档（逐层哈希校验），
          # 供无注册表访问的服务器离线 docker load
          docker buildx build \
            --platform linux/amd64 \
            --output type=oci,dest=image-oci.tar \
            --provenance=false \
            --cache-from type=gha \
            .
          python scripts/oci2docker-archive.py image-oci.tar tr-torrent-ui-amd64.tar.gz \
            --tag tr-torrent-ui:latest
          tar -tzf tr-torrent-ui-amd64.tar.gz | grep -q '^manifest.json$' \
            || { echo "转换失败：非传统 Docker 归档"; exit 1; }
          echo "归档内容："; tar -tzf tr-torrent-ui-amd64.tar.gz | head -5

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: tr-torrent-ui-${{ steps.meta.outputs.version }}-amd64-docker-archive
          path: tr-torrent-ui-amd64.tar.gz
          retention-days: 90
          if-no-files-found: error
